name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  syntax-lint:
    name: Syntax and lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.6"
          enable-cache: false
      - name: Install Python from .python-version
        run: uv python install
      # Compile only: never import or run the reboot scripts, or load .env.
      - name: Check Python syntax
        run: uv run --no-project python -m py_compile *.py
      - name: Lint Python
        run: uv tool run ruff==0.17.3 check .
