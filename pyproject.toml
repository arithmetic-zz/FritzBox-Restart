[project]
name = "fritzbox-restart"
version = "3.0.0"
description = "CLI tool to reboot an AVM FRITZ!Box via TR-064 or Playwright"
requires-python = ">=3.15"
dependencies = [
    "fritzconnection>=1.15.1",
    "playwright>=1.64.1",
    "python-dotenv>=1.2.4",
]

[tool.ruff.lint]
# Basic correctness: syntax errors, invalid comparisons, and undefined names.
select = ["E9", "F63", "F7", "F82"]
